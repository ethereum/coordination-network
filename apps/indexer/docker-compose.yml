services:
    postgres:
        image: postgres:18-alpine
        environment:
            POSTGRES_DB: indexer
            POSTGRES_PASSWORD: postgres
        ports:
            # loopback only, and not 5432, so a natively installed postgres never collides
            - "127.0.0.1:5433:5432"
        volumes:
            - postgres-data:/var/lib/postgresql

volumes:
    postgres-data:
