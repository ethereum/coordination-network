name: Setup
description: Node, Foundry, Nargo and dependencies, pinned to the versions the repo builds with

runs:
    using: composite
    steps:
        - uses: actions/setup-node@v5
          with:
              node-version: 22
              cache: yarn

        - uses: foundry-rs/foundry-toolchain@v1
          with:
              version: "1.8.5"

        - uses: noir-lang/noirup@v0.1.2
          with:
              toolchain: 1.0.0-beta.22

        - run: yarn
          shell: bash
