name: user-app

permissions:
    contents: read

on:
    pull_request:
        paths-ignore:
            - "apps/docs/**"
    push:
        branches:
            - main
        paths-ignore:
            - "apps/docs/**"

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - uses: ./.github/actions/setup
            - run: yarn build
            # circuit-abi.test.ts imports the gitignored src/generated/credential-abi.json this writes.
            - run: apps/user-app/scripts/sync-assets.sh
            - run: yarn workspace user-app test
            - run: yarn workspace @coordination-network/app-ui test
