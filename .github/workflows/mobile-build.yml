name: mobile-build

permissions:
    contents: read

on:
    # Manual only. Run it before shipping an identity-testbed build.
    # Needs an EAS project: app.json ships without one, so run `eas init` in apps/identity-testbed and commit the projectId it adds.
    workflow_dispatch:

    # pull_request:
    #     paths:
    #         - "apps/identity-testbed/**"
    #         - ".github/workflows/mobile-build.yml"

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    android-preview-apk:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v5

            - name: Install Node.js
              uses: actions/setup-node@v5
              with:
                  node-version: 22
                  cache: yarn

            - name: Install dependencies
              run: yarn

            - name: Install EAS CLI
              run: npm install --global eas-cli

            - name: Build Android APK (preview profile)
              working-directory: apps/identity-testbed
              env:
                  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
              run: eas build --platform android --profile preview --non-interactive
