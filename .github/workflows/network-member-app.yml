name: network-member-app

permissions:
    contents: read

on:
    pull_request:
        paths-ignore:
            - "apps/docs/**"
    push:
        branches:
            - main
        paths-ignore:
            - "apps/docs/**"

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - uses: ./.github/actions/setup
            - run: yarn workspace network-member-app test
