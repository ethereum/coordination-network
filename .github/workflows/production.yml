name: production

permissions:
    contents: read

on:
    push:
        branches:
            - main
        paths-ignore:
            - "apps/docs/**"

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    # Duplicates the PR run. Delete once required status checks are available.
    ci:
        uses: ./.github/workflows/ci.yml

