# Generated by uniffi-bindgen-react-native
[package]
name = "mopro-ffi"
version = "0.1.0"
edition = "2018"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []

[dependencies]
noir-prover-native = { path = "../../.." }
# Use the runtime crate that ships with the current UBRN install so the
# generated wasm crate stays in lock-step with the CLI/runtime implementation.
uniffi-runtime-javascript = { version = "=0.31.0-3", features = ["wasm32"] }
wasm-bindgen = "*"

[profile.release]
# Tell `rustc` to optimize for speed
opt-level = 3

[workspace]
